name: Import Exported Graphs

on:
  push:
    branches:
      - 'graph-export/**'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and move exported graphs
        run: |
          set -euo pipefail
          mkdir -p .github/workflows/graphs
          UPDATED=false
          for f in $(git ls-files 'web/exported-graph-*.yml' || true); do
            mv "$f" ".github/workflows/graphs/$(basename "$f")"
            git add ".github/workflows/graphs/$(basename "$f")"
            UPDATED=true
          done
          if [ "$UPDATED" = false ]; then
            echo "No exported graphs found; nothing to import"
            exit 0
          fi
          git commit -m "chore(graph): import exported Actionforge graphs"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(graph): import exported Actionforge graphs"
          title: "Import exported Actionforge graph(s)"
          body: "This PR imports exported Actionforge graph(s) into .github/workflows/graphs/"
          branch: import/exported-graphs
