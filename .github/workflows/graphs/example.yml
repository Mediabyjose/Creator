# Example Actionforge graph (minimal example)
# Replace this with a real graph exported from the Actionforge editor.
# This example is intentionally simple so you can test the integration.

graph:
  metadata:
    name: example-hello
  nodes:
    - id: node1
      type: run
      name: say-hello
      # `run` should contain the shell or command to execute
      run: echo "Hello from Actionforge graph"
  edges: []
