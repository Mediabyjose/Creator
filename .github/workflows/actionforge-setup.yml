name: ActionForge Setup

on:
  push:
    branches:
      - main
      - 'feature/actionforge-setup'

jobs:
  setup-actionforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ActionForge setup
        run: npm run setup-actionforge
