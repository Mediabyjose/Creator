<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Creator - Drag & Drop Layout Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Creator — Visual Layout (HTML / JS)</h1>
    </header>

    <main class="container">
      <aside class="palette">
        <h2>Components</h2>
        <div id="components" class="components">
          <div class="component" draggable="true">Button</div>
          <div class="component" draggable="true">Header</div>
          <div class="component" draggable="true">Paragraph</div>
          <div class="component" draggable="true">Image</div>
        </div>
      </aside>

      <section class="canvas">
        <h2>Canvas</h2>
        <div id="layout" class="layout">
          <!-- Drop components here -->
        </div>

        <div class="canvas-controls" style="margin-top:12px">
          <button id="exportYml" class="vscode-button">Export Graph (Download YAML)</button>
          <button id="downloadJson" class="vscode-button">Export JSON (download)</button>
          <small style="display:block;margin-top:8px;color:#666">Use the exported YAML and run <code>scripts/commit-graph.sh</code> to create a branch & push an import PR automatically.</small>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
